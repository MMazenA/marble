syntax = "proto3";

package marble;

import "aggregates.proto";

option cc_enable_arenas = true;

enum ActionType {
  ACTION_HOLD = 0;
  ACTION_BUY = 1;
  ACTION_SELL = 2;
}

message Signal {
  ActionType action = 1;
  string reason = 2;
}

message Trade {
  ActionType action = 1;
  int32 quantity = 2;
  double price = 3;
}

message AccountState {
  double cash = 1;
  int32 shares = 2;
  double avg_buy_price = 3;
  double realized_pnl = 4;
  double total_equity = 5;
}

message Snapshot {
  uint64 step = 1;
  AggregateBar candle = 2;
  Signal signal = 3;
  optional Trade trade = 4;
  AccountState account = 5;
}

message BacktestConfig {
  string strategy_name = 1;
  string symbol = 2;
  int64 start = 3;
  int64 end = 4;
}

message BacktestSummary {
  double start_balance = 1;
  double end_balance = 2;
  double return_percent = 3;
  int32 trade_count = 4;
}

message BacktestEvent {
  oneof event {
    BacktestConfig started = 1;
    Snapshot step = 2;
    BacktestSummary end = 3;
  }
}

message BacktestRequest {
  string symbol = 1;
  int64 start = 2;
  int64 end = 3;
  double starting_cash = 4;
}

service BacktestService {
  rpc RunBackTest(BacktestRequest) returns (stream BacktestEvent);
}
